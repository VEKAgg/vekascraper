[project]
name = "vekascraper-export-api"
version = "0.1.0"
description = "Internal FastAPI for job queue, state, and cancellation"
requires-python = ">=3.12"
dependencies = [
    "vekascraper-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
