[project]
name = "vekascraper-message-worker"
version = "0.1.0"
description = "Worker that polls for message-extraction jobs and executes DiscordChatExporter"
requires-python = ">=3.12"
dependencies = [
    "vekascraper-shared",
    "httpx>=0.28",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
