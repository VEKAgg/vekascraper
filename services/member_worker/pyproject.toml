[project]
name = "vekascraper-member-worker"
version = "0.1.0"
description = "Worker that polls for member-extraction jobs and executes pixelatedxp/discord-member-scraper"
requires-python = ">=3.12"
dependencies = [
    "vekascraper-shared",
    "httpx>=0.28",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
