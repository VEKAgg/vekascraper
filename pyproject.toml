[project]
name = "vekascraper"
version = "0.1.0"
description = "Self-hosted Discord archive control system"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["data/", ".venv/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["data/", ".venv/"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests", "shared/src/shared", "services"]
addopts = "-v --tb=short"
